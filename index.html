      right: 15px;
      z-index: 1000;
      background: rgba(255, 65, 108, 0.85);
      border: 2px solid #fff;
      color: #fff;
      border-radius: 50px;

      align-items: center;
      gap: 6px;

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .balloon {
      position: absolute;
      bottom: -160px;
      width: 95px;  /* Big Balloon Size */

      align-items: center;
      justify-content: center;
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.4);
    }
    .balloon::before {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 46px;
      width: 2px;
      height: 22px;
      background: rgba(255,255,255,0.7);
    }
    .balloon-text {
      color: #ffffff;
      font-weight: 900;
      font-size: 0.8rem;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0,0,0,0.8);
      text-align: center;
      padding: 4px;
      line-height: 1.2;
      pointer-events: none;
      word-break: break-word;

      0% { transform: translateY(0) rotate(0deg); opacity: 0.95; }

      padding: 20px;
      max-width: 1100px;

    .photo-front, .photo-back {

    .photo-back {

    .card {
